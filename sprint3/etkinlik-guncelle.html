<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle · Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501017.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <header class="site-baslik">
    <h1>Etkinlik Güncelle</h1>
  </header>
  <nav class="menu" aria-label="Ana menü">
    <ul>
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="etkinlikler.html">Etkinlikler</a></li>
      <li><a href="etkinlik-ekle.html">Ekle</a></li>
    </ul>
  </nav>

  <main>
    <p id="form-bilgi" class="bilgi-notu">Alanlar seçilen etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez.</p>

    <!-- Bu sayfaya sadece detaydaki "Bu etkinliği güncelle" ile gelinir (?id=...) -->
    <form id="etkinlik-formu" class="form" data-mode="guncelle" novalidate>
      <div class="alan">
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad" maxlength="80">
        <span id="ad-hata" class="hata-metni"></span>
      </div>

      <div class="alan">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori">
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
          <option value="Yarışma">Yarışma</option>
        </select>
        <span id="kategori-hata" class="hata-metni"></span>
      </div>

      <div class="alan">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih">
        <span id="tarih-hata" class="hata-metni"></span>
      </div>

      <div class="alan">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat">
        <span id="saat-hata" class="hata-metni"></span>
      </div>

      <div class="alan">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer">
        <span id="yer-hata" class="hata-metni"></span>
      </div>

      <div class="alan">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" inputmode="numeric">
        <span id="kontenjan-hata" class="hata-metni"></span>
      </div>

      <div class="alan">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="5"></textarea>
      </div>

      <button type="submit">Güncelle</button>
    </form>

    <div id="form-mesaj" aria-live="polite"></div>
  </main>

  <footer class="site-alt">
    <p>Orhan Öztekin · 2416501017 · 2026</p>
  </footer>
</body>
</html>
